<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Empty icon: stops the browser requesting /favicon.ico (a 404). Real icon comes with the UI design. -->
    <link rel="icon" href="data:," />
    <title>Battle of the Bros</title>
  </head>
  <body class="home">
    <!-- The stage is a fixed 1280 x 890 drawing, scaled to fit the window.
         Everything inside is placed at exact positions by home.css.
         The wrapper takes up the stage's scaled size, so the page centres it. -->
    <div class="stage-wrap">
      <main class="stage">
        <h1 class="art title"><img src="/art/title/title.png" alt="Battle of the Bros" /></h1>
        <img class="art byline" src="/art/title/byline.png" alt="a game of games by Peyton" />

        <!-- Decorations: hidden from screen readers. Each has its own class to style it separately. -->
        <img class="art piece-card" src="/art/title/card.png" alt="" aria-hidden="true" />
        <img class="art piece-key" src="/art/title/key.png" alt="" aria-hidden="true" />
        <img class="art piece-blocks" src="/art/title/blocks.png" alt="" aria-hidden="true" />
        <img class="art piece-bishop" src="/art/title/bishop.png" alt="" aria-hidden="true" />
        <img class="art piece-knight" src="/art/title/knight.png" alt="" aria-hidden="true" />
        <img class="art piece-stopwatch" src="/art/title/stopwatch.png" alt="" aria-hidden="true" />
        <img class="art piece-pin" src="/art/title/pin.png" alt="" aria-hidden="true" />

        <!-- Buttons: filled in by /src/pages/home.ts -->
        <div id="app"></div>
      </main>
    </div>
    <!-- type="module" lets the script use import/export; Vite resolves the .ts file. -->
    <script type="module" src="/src/pages/home.ts"></script>
  </body>
</html>
